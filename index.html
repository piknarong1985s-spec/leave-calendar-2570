            { name: "ตุลาคม", bg1: "#F7E1D9", bg2: "#F1C78A", border: "#F1C78A", cellBorder: "#FBEDE7", text: "#444444", holText: "#E53E3E", satSunBg: "#ECECEC", holBg: "#FFF5AF" },
            { name: "พฤศจิกายน", bg1: "#D6CEE3", bg2: "#EDBCAA", border: "#EDBCAA", cellBorder: "#EBE6F2", text: "#444444", holText: "#E53E3E", satSunBg: "#ECECEC", holBg: "#FCF2E3" },

        // 🎌 วันหยุดของบริษัท (ตาม PDF) - แสดงสีวันหยุด
        const thaiHolidays2027 = {
            "2027-01-01": "วันขึ้นปีใหม่",
            "2027-02-22": "ชดเชยวันมาฆบูชา",
            "2027-04-12": "วันหยุดพิเศษเพิ่มเติม",
            "2027-04-13": "วันสงกรานต์",
            "2027-04-14": "วันสงกรานต์",
            "2027-04-15": "วันสงกรานต์",
            "2027-05-03": "ชดเชยวันแรงงาน",
            "2027-06-03": "วันเฉลิมพระชนมพรรษา สมเด็จพระนางเจ้าฯ พระบรมราชินี",
            "2027-07-28": "วันเฉลิมพระชนมพรรษา พระบาทสมเด็จพระเจ้าอยู่หัว (ร.10)",
            "2027-08-12": "วันแม่แห่งชาติ",
            "2027-10-13": "วันนวมินทรมหาราช",
            "2027-12-06": "ชดเชยวันพ่อแห่งชาติ",
            "2027-12-29": "วันหยุดพิเศษเพิ่มเติม",
            "2027-12-30": "วันหยุดพิเศษเพิ่มเติม",
            "2027-12-31": "วันสิ้นปี"
        };

        // 📌 วันสำคัญที่บริษัทไม่หยุด - แสดงชื่อวันไว้เฉยๆ ไม่ใส่สี ทำงานตามปกติ
        const noteOnlyDays2027 = {
            "2027-02-21": "วันมาฆบูชา",
            "2027-04-06": "วันจักรี",
            "2027-05-01": "วันแรงงาน",
            "2027-05-04": "วันฉัตรมงคล",
            "2027-05-20": "วันวิสาขบูชา",
            "2027-07-18": "วันอาสาฬหบูชา",
            "2027-07-19": "วันเข้าพรรษา",
            "2027-10-23": "วันปิยมหาราช",
            "2027-10-25": "ชดเชยวันปิยมหาราช",
            "2027-12-05": "วันพ่อแห่งชาติ",
            "2027-12-10": "วันรัฐธรรมนูญ"
        };

        // 💼 วันเสาร์ที่เป็นวันทำงาน (ตาม PDF)
        const workingSaturdays2027 = {
            "2027-03-13": "Safety Day",
            "2027-05-15": "Company Trip",
            "2027-12-11": "Company Party"
        };

        // 🎤 Morning Talk (ตาม PDF)
        const morningTalk2027 = {
            "2027-01-05": "MD",
            "2027-02-03": "GM",
            "2027-03-03": "HR & Admin Dept.",
            "2027-04-06": "Accounting Dept.",
            "2027-05-05": "Sales Dept.",
            "2027-06-04": "Purchasing Dept.",
            "2027-07-02": "QC Dept.",
            "2027-08-04": "Store Dept.",
            "2027-09-03": "IT Dept.",
            "2027-10-05": "QMS",
            "2027-11-03": "Safety Team",
            "2027-12-03": "MD"
        };

        const dayNamesFull = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
        const dayNamesShort = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."];
        
        let currentMonth = 0;
        let globalLeaveData = {};
        const year = 2027;

        // ตัวแปรเก็บข้อมูลชั่วคราวสำหรับการลบ
        let pendingDelete = { dateKey: null, firebaseKey: null };

        function renderCalendar(monthIndex) {
            const theme = monthThemes[monthIndex];
            document.body.style.background = `linear-gradient(160deg, ${theme.bg1} 0%, ${theme.bg2} 100%)`;
            document.body.style.backgroundAttachment = "fixed";
            
            const card = document.getElementById("calendarCard");
            card.style.backgroundColor = theme.bg1;
            card.style.borderColor = theme.border;

            document.getElementById("monthTitle").innerText = theme.name;
            document.getElementById("monthSelect").value = monthIndex;

            const daysHeaderGrid = document.getElementById("daysHeaderGrid");
            daysHeaderGrid.innerHTML = "";
            dayNamesFull.forEach((d, idx) => {
                const header = document.createElement("div");
                header.className = "py-1.5 sm:py-2.5 md:py-3 font-header text-xs sm:text-sm md:text-base font-semibold rounded-xl sm:rounded-2xl shadow-xs";
                // แสดงชื่อย่อบนจอมือถือ และแสดงชื่อเต็มบนจอแท็บเล็ตขึ้นไป
                header.innerHTML = `<span class="sm:hidden">${dayNamesShort[idx]}</span><span class="hidden sm:inline">${d}</span>`;
                header.style.color = theme.headText || theme.text;
                header.style.backgroundColor = (idx === 0 || idx === 6) ? theme.satSunBg : theme.bg2;
                daysHeaderGrid.appendChild(header);
            });

            const calendarGrid = document.getElementById("calendarGrid");
            calendarGrid.innerHTML = "";

            const firstDayIndex = new Date(year, monthIndex, 1).getDay();
            const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

            for (let i = 0; i < 42; i++) {
                const dayNumber = i - firstDayIndex + 1;
                const cell = document.createElement("div");
                
                if (i < firstDayIndex || dayNumber > daysInMonth) {
                    cell.className = "min-h-[68px] sm:min-h-[95px] md:min-h-[115px] p-1 sm:p-2 rounded-xl sm:rounded-2xl bg-white/20 border border-transparent opacity-30 pointer-events-none";
                } else {
                    const colIndex = i % 7;
                    const isSaturday = colIndex === 6;
                    const isSunday = colIndex === 0;
                    
                    const monthStr = String(monthIndex + 1).padStart(2, '0');
                    const dayStr = String(dayNumber).padStart(2, '0');
                    const dateKey = `${year}-${monthStr}-${dayStr}`;

                    const isHoliday = thaiHolidays2027.hasOwnProperty(dateKey);
                    const holidayName = thaiHolidays2027[dateKey];
                    const isSatWorking = isSaturday && workingSaturdays2027[dateKey];
                    const noteName = noteOnlyDays2027[dateKey];

                    cell.className = "day-cell min-h-[68px] sm:min-h-[95px] md:min-h-[115px] p-1 sm:p-2 md:p-2.5 rounded-xl sm:rounded-2xl border flex flex-col justify-between cursor-pointer shadow-2xs relative overflow-hidden";
                    
                    if (isHoliday) {
                        cell.style.backgroundColor = theme.holBg;
                        cell.style.borderColor = theme.border;
                    } else if (isSatWorking) {
                        cell.style.backgroundColor = "#FFFFFF";
                        cell.style.borderColor = "#FCD34D";
                    } else if (isSunday || isSaturday) {
                        cell.style.backgroundColor = theme.satSunBg;
                        cell.style.borderColor = theme.cellBorder;
                    } else {
                        cell.style.backgroundColor = "#FFFFFF";
                        cell.style.borderColor = theme.cellBorder;
                    }

                    const topRow = document.createElement("div");
                    topRow.className = "flex flex-col sm:flex-row justify-between items-start gap-0.5";

                    const numSpan = document.createElement("span");
                    numSpan.className = "font-header text-xs sm:text-base md:text-lg font-semibold px-0.5 leading-none";
                    numSpan.innerText = dayNumber;
                    numSpan.style.color = isHoliday ? theme.holText : theme.text;
                    topRow.appendChild(numSpan);

                    if (isHoliday) {
                        const holTag = document.createElement("span");
                        holTag.className = "text-[8px] sm:text-[10px] md:text-[11px] font-medium leading-tight text-left sm:text-right px-1 rounded bg-white/70 py-0.5 break-words min-w-0 w-full sm:w-auto";
                        holTag.style.color = theme.holText;
                        holTag.innerText = holidayName;
                        topRow.appendChild(holTag);
                    } else if (isSatWorking) {
                        const workTag = document.createElement("span");
                        workTag.className = "text-[8px] sm:text-[10px] md:text-xs font-medium leading-tight text-center px-1 py-0.5 rounded bg-amber-100 text-amber-700 font-semibold w-full sm:w-auto";
                        workTag.innerHTML = `<span class="sm:hidden">💼 ทำงาน</span><span class="hidden sm:inline">💼 ${isSatWorking}</span>`;
                        topRow.appendChild(workTag);
                    } else if (noteName) {
                        const noteTag = document.createElement("span");
                        noteTag.className = "text-[8px] sm:text-[10px] md:text-[11px] font-medium leading-tight text-left sm:text-right px-1 rounded bg-slate-100 text-slate-500 py-0.5 break-words min-w-0 w-full sm:w-auto";
                        noteTag.innerText = noteName;
                        topRow.appendChild(noteTag);
                    }

                    cell.appendChild(topRow);

                    // 🎤 Morning Talk
                    const talkName = morningTalk2027[dateKey];
                    if (talkName) {
                        const talkTag = document.createElement("div");
                        talkTag.className = "mt-0.5 text-[8px] sm:text-[10px] md:text-[11px] font-medium leading-tight px-1 py-0.5 rounded bg-emerald-100 text-emerald-700 break-words";
                        talkTag.innerHTML = `🎤 <span class="hidden sm:inline">Morning Talk: </span>${talkName}`;
                        cell.appendChild(talkTag);
                    }

                    const leaveContainer = document.createElement("div");
                    leaveContainer.className = "space-y-0.5 sm:space-y-1 mt-1";

                    if (globalLeaveData[dateKey]) {
                        Object.entries(globalLeaveData[dateKey]).forEach(([firebaseKey, person]) => {
                            const badge = document.createElement("div");
                            badge.className = "text-[9px] sm:text-[11px] md:text-xs py-0.5 px-1 sm:px-2 rounded-lg sm:rounded-xl flex items-start justify-between gap-0.5 shadow-2xs font-medium border border-pink-100 bg-pink-50/90";
                            badge.style.color = "#555555";
                            
                            const nameSpan = document.createElement("span");
                            nameSpan.className = "min-w-0 flex-1 break-words leading-tight py-0.5";
                            nameSpan.innerText = `🌸 ${person}`;
                            
                            const delBtn = document.createElement("button");
                            delBtn.type = "button";
                            delBtn.className = "hover:text-red-500 active:text-red-600 shrink-0 text-pink-400 font-bold px-1 text-xs sm:text-sm leading-none";
                            delBtn.innerHTML = "&times;";
                            delBtn.onclick = (e) => openDeleteModal(dateKey, firebaseKey, person, e);

                            badge.appendChild(nameSpan);
                            badge.appendChild(delBtn);
                            leaveContainer.appendChild(badge);
                        });
                    }

                    cell.appendChild(leaveContainer);

                    cell.onclick = (e) => {
                        if (e.target.tagName !== 'BUTTON') {
                            openBookingModal(dateKey, dayNumber, theme.name);
                        }
                    };
                }

                calendarGrid.appendChild(cell);
            }
        }

        // วาดตารางปฏิทินทันที
        renderCalendar(currentMonth);

        // ฟัง Real-time Data จาก Firebase
        if (db) {
            db.ref("leaveBookings2570").on("value", (snapshot) => {
                globalLeaveData = snapshot.val() || {};
                renderCalendar(currentMonth);
            }, (error) => {
                console.error("Firebase Read Error:", error);
            });
        }

        // จัดการ Modal จองวันลา
        function openBookingModal(dateKey, dayNum, monthName) {
            document.getElementById("selectedDateKey").value = dateKey;
            document.getElementById("modalDateTitle").innerText = `จองวันลาวันที่ ${dayNum} ${monthName} 2570`;
            document.getElementById("employeeName").value = "";
            document.getElementById("bookingModal").classList.remove("hidden");
            setTimeout(() => document.getElementById("employeeName").focus(), 100);
        }

        document.getElementById("closeModalBtn").onclick = () => {
            document.getElementById("bookingModal").classList.add("hidden");
        };

        document.getElementById("leaveForm").onsubmit = (e) => {
            e.preventDefault();
            const dateKey = document.getElementById("selectedDateKey").value;
            const name = document.getElementById("employeeName").value.trim();

            if (name && dateKey) {
                if (db) {
                    db.ref(`leaveBookings2570/${dateKey}`).push(name).then(() => {
                        document.getElementById("bookingModal").classList.add("hidden");
                    }).catch((error) => {
                        alert("เกิดข้อผิดพลาดในการบันทึก: " + error.message);
                    });
                } else {
                    alert("ยังไม่ได้เชื่อมต่อฐานข้อมูล Firebase");
                }
            }
        };

        // จัดการ Modal ยืนยันการลบ
        function openDeleteModal(dateKey, firebaseKey, personName, event) {
            event.stopPropagation();
            pendingDelete = { dateKey, firebaseKey };
            
            const confirmText = document.getElementById("deleteConfirmText");
            confirmText.innerHTML = `ต้องการลบวันลาของ <span class="font-semibold text-pink-600">"${personName}"</span> ใช่หรือไม่?`;
            
            document.getElementById("deleteModal").classList.remove("hidden");
        }

        document.getElementById("cancelDeleteBtn").onclick = () => {
            document.getElementById("deleteModal").classList.add("hidden");
            pendingDelete = { dateKey: null, firebaseKey: null };
        };

        document.getElementById("confirmDeleteBtn").onclick = () => {
            if (db && pendingDelete.dateKey && pendingDelete.firebaseKey) {
                db.ref(`leaveBookings2570/${pendingDelete.dateKey}/${pendingDelete.firebaseKey}`).remove()
                    .then(() => {
                        document.getElementById("deleteModal").classList.add("hidden");
                        pendingDelete = { dateKey: null, firebaseKey: null };
                    })
                    .catch((error) => {
                        alert("เกิดข้อผิดพลาดในการลบ: " + error.message);
                    });
            }
        };

        // ปุ่มเปลี่ยนเดือน
        document.getElementById("prevMonth").onclick = () => {
            currentMonth = (currentMonth - 1 + 12) % 12;
            renderCalendar(currentMonth);
        };

        document.getElementById("nextMonth").onclick = () => {
            currentMonth = (currentMonth + 1) % 12;
            renderCalendar(currentMonth);
        };

        document.getElementById("monthSelect").onchange = (e) => {
            currentMonth = parseInt(e.target.value);
            renderCalendar(currentMonth);
        };
    </script>
</body>
</html>
